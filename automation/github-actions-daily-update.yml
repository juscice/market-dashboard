name: Manual Baseline Snapshot Refresh

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run baseline snapshot script
        run: python -u scripts/update_daily.py

      - name: Commit updated baseline data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard_data.json data/dashboard_data.js data/morning_briefing.json data/briefings/ data/etf_history_cache.json data/cache/ dist/market-dashboard-share.html dist/gold-share.html dist/yandongwei-share.html
          git diff --cached --quiet || git commit -m "chore: manual baseline snapshot update ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push

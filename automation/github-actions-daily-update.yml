name: Daily Market Dashboard Update

on:
  schedule:
    # 周一至周五 23:05 北京时间（UTC 15:05）
    - cron: "5 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily update script
        run: python -u scripts/update_daily.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard_data.json data/dashboard_data.js data/etf_history_cache.json data/cache/ dist/market-dashboard-share.html dist/yandongwei-share.html
          git diff --cached --quiet || git commit -m "chore: daily market data update ($(date -u +'%Y-%m-%d'))"
          git push
